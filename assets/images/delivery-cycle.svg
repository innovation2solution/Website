<circle class="core" cx="300" cy="280" r="92"/>
<text class="core-t" x="300" y="274">Built to fit,</text>
<text class="core-t" x="300" y="298">built to last</text>
<circle class="node" cx="300.0" cy="110.0" r="27"/>
<text class="num" x="300.0" y="115.0">01</text>
<text class="lbl" x="300.0" y="53.0">Understand<tspan x="300.0" dy="17">discovery &amp; scoping</tspan></text>
<circle class="node alt" cx="447.2" cy="195.0" r="27"/>
<text class="num alt" x="447.2" y="200.0">02</text>
<text class="lbl" x="484.2" y="192.0" style="text-anchor:start">Design<tspan x="484.2" dy="17">architecture &amp; UX</tspan></text>
<circle class="node" cx="447.2" cy="365.0" r="27"/>
<text class="num" x="447.2" y="370.0">03</text>
<text class="lbl" x="484.2" y="362.0" style="text-anchor:start">Build<tspan x="484.2" dy="17">bespoke development</tspan></text>
<circle class="node alt" cx="300.0" cy="450.0" r="27"/>
<text class="num alt" x="300.0" y="455.0">04</text>
<text class="lbl" x="300.0" y="497.0">Deliver<tspan x="300.0" dy="17">test, launch, migrate</tspan></text>
<circle class="node" cx="152.8" cy="365.0" r="27"/>
<text class="num" x="152.8" y="370.0">05</text>
<text class="lbl" x="115.8" y="362.0" style="text-anchor:end">Adopt<tspan x="115.8" dy="17">training &amp; support</tspan></text>
<circle class="node alt" cx="152.8" cy="195.0" r="27"/>
<text class="num alt" x="152.8" y="200.0">06</text>
<text class="lbl" x="115.8" y="192.0" style="text-anchor:end">Improve<tspan x="115.8" dy="17">iterate &amp; evolve</tspan></text>
