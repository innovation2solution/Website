<svg class="qa-cycle" style="background:#0A1F3C;font-family:sans-serif" viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dc-t dc-d">
<title id="dc-t">How we deliver</title>
<desc id="dc-d">Six stages in a loop: understand, design, build, deliver, adopt and improve, which feeds back into understanding.</desc>
<style>.ring{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2;stroke-dasharray:4 6}.arc{fill:none;stroke:#7DD3FC;stroke-width:2.5}.node{fill:#122A52;stroke:rgba(125,211,252,.6);stroke-width:1.5}.node.alt{stroke:rgba(110,231,183,.7)}.num{fill:#7DD3FC;font:800 15px sans-serif;text-anchor:middle}.num.alt{fill:#6EE7B7}.lbl{fill:#fff;font:600 13px sans-serif;text-anchor:middle}.core{fill:rgba(3,105,161,.18);stroke:rgba(125,211,252,.35)}.core-t{fill:#fff;font:800 18px sans-serif;text-anchor:middle}</style><defs><marker id="qa-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7DD3FC"/></marker></defs>
